<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartment Hub - Вход</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/theme.js"></script>
</head>
<body class="light-theme">
    <header>
        <div class="container">
            <h1>🏢 Apartment Hub</h1>
            <button id="theme-toggle" onclick="toggleTheme()" class="btn btn-small" style="background: rgba(255,255,255,0.2); color: white; position: absolute; right: 20px; top: 20px;"></button>
        </div>
    </header>

    <div class="container">
        <div class="card" style="max-width: 400px; margin: 50px auto;">
            <div class="card-header">
                <h2>Вход</h2>
            </div>

            <form onsubmit="event.preventDefault(); window.hub.login(document.getElementById('username').value, document.getElementById('password').value);">
                <div class="form-group">
                    <label for="username">Логин:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
            </form>

            <p style="text-align: center; margin-top: 20px;">
                Нет аккаунта? <a href="/auth/register">Зарегистрироваться</a>
            </p>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
