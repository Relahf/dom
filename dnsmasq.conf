# dnsmasq configuration for Apartment Hub Captive Portal

# Interface to bind to
interface=eth0
interface=eth1
interface=wlan0
interface=wlan1
interface=docker0

# Listen on all addresses
listen-address=0.0.0.0

# Don't read system /etc/resolv.conf
no-resolv

# Don't poll /etc/resolv.conf
no-poll

# Use Google DNS as upstream (if needed)
# nameserver=8.8.8.8
# nameserver=8.8.4.4

# Wildcard DNS - resolve all requests to the application IP
address=/#/172.17.0.2

# Cache DNS requests
cache-size=1000

# Log queries (optional, can be verbose)
# log-queries
# log-facility=/var/log/dnsmasq.log

# DHCP configuration (optional)
# Uncomment if you want DHCP from dnsmasq
# dhcp-range=192.168.1.100,192.168.1.200,24h
# dhcp-option=option:router,192.168.1.1

# Increase query timeout
dhcp-authoritative
